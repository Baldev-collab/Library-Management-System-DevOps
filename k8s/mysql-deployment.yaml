apiVersion: apps/v1
kind: Deployment
metadata:
  name: library-mysql
  namespace: library-management
  labels:
    app: library-mysql
    app.kubernetes.io/name: library-management-system
    app.kubernetes.io/component: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: library-mysql
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: library-mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3306
              name: mysql
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: library-mysql-secret
                  key: mysql-root-password
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: library-mysql-secret
                  key: mysql-database
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: library-mysql-secret
                  key: mysql-user
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: library-mysql-secret
                  key: mysql-password
          resources:
            requests:
              cpu: "150m"
              memory: "384Mi"
            limits:
              cpu: "1000m"
              memory: "768Mi"
          volumeMounts:
            - name: mysql-storage
              mountPath: /var/lib/mysql
      volumes:
        - name: mysql-storage
          persistentVolumeClaim:
            claimName: library-mysql-pvc
