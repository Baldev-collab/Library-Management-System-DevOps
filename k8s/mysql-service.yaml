apiVersion: v1
kind: Service
metadata:
  name: library-mysql
  namespace: library-management
  labels:
    app: library-mysql
    app.kubernetes.io/name: library-management-system
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  ports:
    - port: 3306
      targetPort: 3306
      name: mysql
  selector:
    app: library-mysql
