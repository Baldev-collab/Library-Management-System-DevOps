apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: library-mysql-pvc
  namespace: library-management
  labels:
    app.kubernetes.io/name: library-management-system
    app.kubernetes.io/component: database
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
